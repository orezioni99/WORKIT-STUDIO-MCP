[project]
name = "workit-studio-mcp"
version = "0.1.0"
description = "One MCP server that connects any AI model to every scriptable CAD, BIM and 3D app, adapted for work in Israel."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "cad", "bim", "autocad", "revit", "archicad", "blender", "rhino", "navisworks"]
dependencies = [
    "mcp>=1.9",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
tekla = ["pythonnet>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
workit = "workit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
